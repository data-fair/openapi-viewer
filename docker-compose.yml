services:

  nginx:
    image: nginx:1.29.4-alpine
    network_mode: host
    environment:
      - DEV_HOST=${DEV_HOST}
      - NGINX_PORT=${NGINX_PORT}
      - DEV_API_PORT=${DEV_API_PORT}
      - DEV_UI_PORT=${DEV_UI_PORT}
      - SD_PORT=${SD_PORT}
    volumes:
      - ./dev/resources/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

  # theme, language and admin session of the integrated mode (useSimpleDirectory in the dev config)
  simple-directory:
    # SD_IMAGE: a local build of simple-directory
    image: ${SD_IMAGE:-ghcr.io/data-fair/simple-directory:master}
    network_mode: host
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - PORT=${SD_PORT}
      - PUBLIC_URL=http://${DEV_HOST}:${NGINX_PORT}/simple-directory
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/simple-directory
      - OBSERVER_ACTIVE=false
      - CIPHER_PASSWORD=dev-cipher-password-0123456789abcdef
      # accounts in mongo, none by default: the tests do not log in. An account for the admin session of the
      # dev page can be seeded through the test API (POST /simple-directory/api/test-env/seed)
      - STORAGE_TYPE=mongo
      - ENABLE_TEST_API=1
      # the test API needs NODE_ENV=development, the configuration stays the image's production one
      - NODE_ENV=development
      - NODE_CONFIG_ENV=production
      - CONTACT=contact@test.com
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${SD_PORT}"]
      interval: 2s
      timeout: 2s
      retries: 60

  mongo:
    # production version; later 8.0 patches refuse Ubuntu 7.0 kernels (https://jira.mongodb.org/browse/SERVER-136848)
    image: mongo:8.0.17
    ports:
      - ${MONGO_PORT}:27017
    # wiredTiger takes half the machine's RAM by default
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      # 2 s probes while starting, then one per minute: a mongosh probe costs ~1.3 s of CPU
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 3m
      start_interval: 2s

volumes:
  mongo-data:
